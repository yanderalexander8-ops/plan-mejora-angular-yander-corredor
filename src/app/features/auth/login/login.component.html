<main class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <span class="logo">DJ</span>
      <span>Panel DummyJSON</span>
    </div>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="muted login-subtitle">Ingresa tus credenciales para continuar</p>

    <div class="alert alert-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          [class.invalid]="username.invalid && username.touched"
        />
        <small class="field-error" *ngIf="username.touched && username.hasError('required')">
          El usuario es obligatorio
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.invalid]="password.invalid && password.touched"
        />
        <small class="field-error" *ngIf="password.touched && password.hasError('required')">
          La contraseña es obligatoria
        </small>
        <small class="field-error" *ngIf="password.touched && password.hasError('minlength')">
          La contraseña debe tener mínimo 6 caracteres
        </small>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="muted login-hint">Usuario de prueba: emilys / emilyspass</p>
  </section>
</main>
